name: profile-sync

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sync-portfolio]
  workflow_dispatch: {}

concurrency:
  group: profile-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository_owner == 'j3ffyang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy PORTFOLIO.md into README
        run: |
          rm -rf /tmp/ai-thoughts
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/ai-thoughts.git" /tmp/ai-thoughts
          cp /tmp/ai-thoughts/PORTFOLIO.md README.md

      - name: Commit and push regenerated README
        env:
          SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is up to date; nothing to commit"
            exit 0
          fi

          git commit -m "docs: sync profile README from PORTFOLIO.md"
          git pull --rebase origin main || true
          git push origin HEAD:main

          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::PROFILE_SYNC_TOKEN secret not set — skipping mirror sync."
            echo "Create a PAT with write access to negtivspace and add it as the PROFILE_SYNC_TOKEN repository secret."
            exit 0
          fi

          if git push "https://x-access-token:${SYNC_TOKEN}@github.com/negtivspace/negtivspace.git" HEAD:main; then
            echo "Cross-synced regenerated README to negtivspace/negtivspace"
          else
            echo "::warning::Failed to cross-push to negtivspace/negtivspace — check PROFILE_SYNC_TOKEN permissions."
          fi
