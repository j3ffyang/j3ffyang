name: profile-sync

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sync-portfolio]
  workflow_dispatch: {}

concurrency:
  group: profile-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository_owner == 'negtivspace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy PORTFOLIO.md into README
        env:
          EXPECT_SHA: ${{ github.event.client_payload.head_sha }}
        run: |
          rm -rf /tmp/ai-thoughts
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/ai-thoughts.git" /tmp/ai-thoughts

          if [ -n "${EXPECT_SHA}" ]; then
            for i in $(seq 1 12); do
              CURRENT=$(git -C /tmp/ai-thoughts rev-parse HEAD 2>/dev/null || echo "")
              if [ "${CURRENT}" = "${EXPECT_SHA}" ]; then
                echo "ai-thoughts is at expected commit ${EXPECT_SHA}"
                break
              fi
              sleep 5
              git -C /tmp/ai-thoughts fetch --depth 1 origin main && git -C /tmp/ai-thoughts reset --hard origin/main || true
            done
            CURRENT=$(git -C /tmp/ai-thoughts rev-parse HEAD)
            if [ "${CURRENT}" != "${EXPECT_SHA}" ]; then
              echo "::warning::ai-thoughts HEAD ${CURRENT} != expected ${EXPECT_SHA} — syncing with what is present"
            fi
          fi

          cp /tmp/ai-thoughts/PORTFOLIO.md README.md

      - name: Commit and push regenerated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is up to date; nothing to commit"
            exit 0
          fi

          git commit -m "docs: sync profile README from PORTFOLIO.md"
          git pull --rebase origin main || true
          git push origin HEAD:main
