name: profile-sync

# Each profile repo publishes its OWN README from the canonical PORTFOLIO.md in
# j3ffyang/ai-thoughts. There is no cross-account push, no PAT, and no mirror:
# the two accounts therefore show identical README *content*, though their
# commit hashes differ (by design).
#
# Triggers:
#   - repository_dispatch(sync-portfolio): optional immediate trigger
#   - schedule: token-free backstop so a missed dispatch still self-heals
#   - workflow_dispatch: manual
# No `on: push` — the workflow's own README commit must not re-trigger it.

on:
  repository_dispatch:
    types: [sync-portfolio]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

concurrency:
  group: profile-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Copy canonical PORTFOLIO.md into README
        run: |
          git clone --depth 1 https://github.com/j3ffyang/ai-thoughts.git /tmp/ai-thoughts
          cp /tmp/ai-thoughts/PORTFOLIO.md README.md

      - name: Commit regenerated README (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is up to date; nothing to commit"
            exit 0
          fi
          git commit -m "docs: sync profile README from PORTFOLIO.md"
          git push origin HEAD:main