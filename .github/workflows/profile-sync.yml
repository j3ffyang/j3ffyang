name: profile-sync

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sync-portfolio]
  workflow_dispatch: {}

concurrency:
  group: profile-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    # Single-writer guard: only the j3ffyang profile repo auto-commits and
    # mirrors. The identical workflow is carried by negtivspace/negtivspace,
    # where this condition is false, so that repo stays a pure mirror.
    if: github.repository_owner == 'j3ffyang'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy PORTFOLIO.md into README
        env:
          EXPECT_SHA: ${{ github.event.client_payload.head_sha }}
        run: |
          rm -rf /tmp/ai-thoughts
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/ai-thoughts.git" /tmp/ai-thoughts

          if [ -n "${EXPECT_SHA}" ]; then
            for i in $(seq 1 12); do
              CURRENT=$(git -C /tmp/ai-thoughts rev-parse HEAD 2>/dev/null || echo "")
              if [ "${CURRENT}" = "${EXPECT_SHA}" ]; then
                echo "ai-thoughts is at expected commit ${EXPECT_SHA}"
                break
              fi
              sleep 5
              git -C /tmp/ai-thoughts fetch --depth 1 origin main && git -C /tmp/ai-thoughts reset --hard origin/main || true
            done
            CURRENT=$(git -C /tmp/ai-thoughts rev-parse HEAD)
            if [ "${CURRENT}" != "${EXPECT_SHA}" ]; then
              echo "::warning::ai-thoughts HEAD ${CURRENT} != expected ${EXPECT_SHA} — syncing with what is present"
            fi
          fi

          cp /tmp/ai-thoughts/PORTFOLIO.md README.md

      - name: Commit regenerated README (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is up to date; nothing to commit"
            exit 0
          fi

          git commit -m "docs: sync profile README from PORTFOLIO.md"
          git pull --rebase origin main || true
          git push origin HEAD:main

      # Runs on every invocation — not only when the README changed — so a
      # guard/workflow drift on the mirror cannot go unnoticed. Fast-forward
      # only; a diverged mirror is reported by the verify step, never clobbered.
      - name: Mirror j3ffyang main to negtivspace
        env:
          SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::PROFILE_SYNC_TOKEN secret not set — skipping mirror sync."
            echo "Create a PAT with write access to negtivspace and add it as the PROFILE_SYNC_TOKEN repository secret."
            exit 0
          fi
          # actions/checkout persists GITHUB_TOKEN as an http.extraheader, and
          # that header overrides the PAT embedded in the push URL — the push
          # would then authenticate as github-actions[bot] and get a 403. Drop
          # the persisted header so the PAT is what actually authenticates.
          git config --unset-all "http.https://github.com/.extraheader" || true
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/negtivspace/negtivspace.git" HEAD:main \
            || echo "::warning::Mirror push rejected (non-fast-forward?) — the verify step below will report it."

      # Self-check: negtivspace is a pure mirror, so its main must equal
      # j3ffyang's main. A mismatch means the guard regressed on the mirror
      # (the exact cause of the repeated non-fast-forward push failures).
      - name: Verify mirror matches j3ffyang (guard regression check)
        run: |
          OWN=$(git rev-parse HEAD)
          MIRROR=$(git ls-remote https://github.com/negtivspace/negtivspace.git refs/heads/main | cut -f1)
          if [ "$OWN" != "$MIRROR" ]; then
            echo "::error::Mirror drift: negtivspace/main=$MIRROR != j3ffyang/main=$OWN — the single-writer guard or the mirror has regressed; reconcile the two remotes."
            exit 1
          fi
          echo "Mirror in sync at $OWN"
